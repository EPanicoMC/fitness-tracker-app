  return meals.reduce((a, m) => ({
    kcal: a.kcal + (m.kcal || 0),
    protein: a.protein + (m.protein || 0),
    carbs: a.carbs + (m.carbs || 0),
    fats: a.fats + (m.fats || 0)
  }), { kcal: 0, protein: 0, carbs: 0, fats: 0 });
}

// ═══════════════════════════════════════════════════════════════
//  SEED FUNCTIONS
// ═══════════════════════════════════════════════════════════════

async function deactivateExisting(userId, collName) {
  const { getDocs: gd } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
  const snap = await gd(collection(db, 'users', userId, collName));
  for (const d of snap.docs) {
    if (d.data().active) {
      await setDoc(doc(db, 'users', userId, collName, d.id), { active: false }, { merge: true });
      log(`  ↳ Disattivato: ${d.data().name || d.id}`);
    }
  }
}

window.seedProgram = async function() {
  const userId = getUserId();
  if (!userId) { log('❌ Utente non autenticato! Fai login prima.', false); return; }
  log(`👤 Utente: ${userId}`);

  try {
    log('💪 Disattivo schede esistenti...');
    await deactivateExisting(userId, 'programs');

    log('💪 Creazione scheda Upper/Lower ×2...');
    const ref = await addDoc(collection(db, 'users', userId, 'programs'), PROGRAM);
    log(`✅ Scheda creata! ID: ${ref.id}`);

    const exCount = Object.values(PROGRAM.schedule)
      .filter(Boolean)
      .reduce((sum, day) => sum + (day.exercises?.length || 0), 0);
    const dayCount = Object.values(PROGRAM.schedule).filter(Boolean).length;
    log(`📊 ${dayCount} giorni, ${exCount} esercizi totali, ${PROGRAM.weeks} settimane`);
  } catch(e) {
    log(`❌ Errore scheda: ${e.message}`, false);
    console.error(e);
  }
};

window.seedDiet = async function() {
  const userId = getUserId();
  if (!userId) { log('❌ Utente non autenticato! Fai login prima.', false); return; }
  log(`👤 Utente: ${userId}`);

  try {
    log('🥗 Disattivo piani dieta esistenti...');
    await deactivateExisting(userId, 'diet_plans');

    log('🥗 Creazione piano dieta 2.300 kcal...');
    const ref = await addDoc(collection(db, 'users', userId, 'diet_plans'), DIET);
    log(`✅ Piano dieta creato! ID: ${ref.id}`);
    log(`📊 ON: ${DIET.day_on.kcal} kcal (P:${DIET.day_on.protein}g C:${DIET.day_on.carbs}g F:${DIET.day_on.fats}g) — ${DIET.day_on.meals.length} pasti`);
    log(`📊 OFF: ${DIET.day_off.kcal} kcal (P:${DIET.day_off.protein}g C:${DIET.day_off.carbs}g F:${DIET.day_off.fats}g) — ${DIET.day_off.meals.length} pasti`);
  } catch(e) {
    log(`❌ Errore dieta: ${e.message}`, false);
    console.error(e);
  }
};

window.seedAll = async function() {
  document.getElementById('seed-all').disabled = true;
  document.getElementById('seed-all').textContent = '⏳ Caricamento...';
  log('🚀 Inizio seed completo Fase 1...');
  log('─'.repeat(40));

  await window.seedProgram();
  log('─'.repeat(40));
  await window.seedDiet();

  log('─'.repeat(40));
  log('🎉 Seed completato! Torna alla home per verificare.');
  document.getElementById('seed-all').textContent = '✅ Fatto!';
};
