// Converte un esercizio dal formato JSON al formato app
function transformExercise(e) {
  // Blocchi (APT / Core): hanno il campo "componenti"
  if (e.componenti) {
    return {
      name: e.nome,
      ordine: e.ordine,
      sets: null,
      reps: null,
      rest_seconds: e.recupero_sec,
      rpe_target: e.rpe || null,
      weight_per_set: [],
      notes: e.note || "",
      durata_min: e.durata_min,
      componenti: e.componenti
    };
  }

  // Costruzione stringa reps (backward compat)
  const reps = e.rip_min === e.rip_max ? `${e.rip_min}` : `${e.rip_min}-${e.rip_max}`;

  const result = {
    name: e.nome,
    ordine: e.ordine,
    sets: e.serie,
    reps: reps,
    rip_min: e.rip_min,
    rip_max: e.rip_max,
    rest_seconds: e.recupero_sec,
    rpe_target: e.rpe,
    incremento_kg: e.incremento_kg || null,
    weight_per_set: [],
    notes: e.note || "",
    variante_sicura: e.variante_sicura || null,
    intensificazione: e.intensificazione || null,
    per_lato: e.per_lato || false,
    superset: e.superset || false
  };

  // Superset: aggiungi range rip del secondo esercizio
  if (e.superset) {
    result.rip_min_b = e.rip_min_b;
    result.rip_max_b = e.rip_max_b;
  }

  return result;
}

// Converte il campo cardio_post dal testo al formato oggetto
function parseCardio(text) {
  if (!text) return null;
  const match = text.match(/LISS (\d+) min\s*(.*)/i);
  if (match) {
    return {
      enabled: true,
      type: "LISS",
      duration_minutes: parseInt(match[1]),
      notes: match[2] || ""
    };
  }
  return { enabled: true, type: "LISS", duration_minutes: 0, notes: text };
}

// Costruisce la sessione di allenamento per lo schedule
function buildSession(seduta) {
  return {
    name: seduta.nome,
    session_id: seduta.id,
    time: seduta.ora,
    durata_stimata_min: seduta.durata_stimata_min,
    cardio: parseCardio(seduta.cardio_post),
    se_sfori: seduta.se_sfori || null,
    exercises: seduta.esercizi.map(transformExercise)
  };
}

// Formatta un array di alimenti in stringa leggibile
// Es: "Farina di riso 45g + Whey 40g + Banana 120g"
function formatAlimenti(alimenti) {
  return alimenti.map(a => {
    if (a.fette !== undefined) return `${a.nome} ×${a.fette} fette`;
    if (a.n !== undefined) return `${a.nome} ×${a.n}`;
    if (a.g !== undefined) {
      if (typeof a.g === 'string') return `${a.nome} (${a.g})`;
      return `${a.nome} ${a.g}g`;
    }
    return a.nome;
  }).join(' + ');
}

// Mappa nome pasto → tipo standard
function mealType(pasto) {
  const map = {
    'Pre-workout': 'pre_workout',
    'Post-workout (entro 45 min)': 'post_workout',
    'Pranzo': 'pranzo',
    'Spuntino': 'spuntino',
    'Cena': 'cena',
    'Sera': 'sera',
    'Colazione': 'colazione'
  };
  return map[pasto] || pasto.toLowerCase().replace(/[^a-z0-9]/g, '_');
}

// Standardizza un'opzione: P/C/G → protein/carbs/fats
function standardizeOpzione(opt) {
  const result = {
    id: opt.id,
    alimenti: opt.alimenti,
    kcal: opt.kcal,
    protein: opt.P,
    carbs: opt.C,
    fats: opt.G
  };
  if (opt.nota) result.nota = opt.nota;
  return result;
}

// Costruisce un pasto nel formato app
function buildMeal(raw) {
  const optA = raw.opzioni.find(o => o.id === 'A');
  const others = raw.opzioni.filter(o => o.id !== 'A');
  return {
    type: mealType(raw.pasto),
    label: raw.pasto,
    time: raw.ora,
    items: formatAlimenti(optA.alimenti),
    kcal: optA.kcal,
    protein: optA.P,
    carbs: optA.C,
    fats: optA.G,
    opzioni: raw.opzioni.map(standardizeOpzione),
    target: {
      kcal: raw.target.kcal,
      protein: raw.target.P,
      carbs: raw.target.C,
      fats: raw.target.G
    },
    variants: others.map(o => ({
      label: `Opzione ${o.id}`,
      detail: formatAlimenti(o.alimenti)
    }))
  };
}

// Costruisce lo schedule dai dati delle sedute
function buildSchedule() {
  const schedule = {
    monday: null,
    tuesday: null,
    wednesday: null,
    thursday: null,
    friday: null,
    saturday: null,
    sunday: null
  };

  for (const seduta of SEDUTE) {
    const day = SESSION_DAY_MAP[seduta.id];
    if (day) {
      schedule[day] = buildSession(seduta);
    }
  }

  return schedule;
}

// Disattiva documenti esistenti in una collection
async function deactivateExisting(userId, collName) {
  const { getDocs: gd } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
  const snap = await gd(collection(db, 'users', userId, collName));
  for (const d of snap.docs) {
    if (d.data().active) {
      await setDoc(doc(db, 'users', userId, collName, d.id), { active: false }, { merge: true });
      log(`  ↳ Disattivato: ${d.data().name || d.id}`);
    }
  }
}

  const userId = getUserId();
  if (!userId) { log('❌ Utente non autenticato! Fai login prima.', false); return; }

  try {
    log('💪 Disattivo schede esistenti...');
    await deactivateExisting(userId, 'programs');

    log('💪 Creazione scheda Upper/Lower ×2 + S5...');
    const ref = await addDoc(collection(db, 'users', userId, 'programs'), PROGRAM);
    log(`✅ Scheda creata! ID: ${ref.id}`);

    // Conteggio esercizi e giorni
    const exCount = Object.values(PROGRAM.schedule)
      .filter(Boolean)
      .reduce((sum, day) => sum + (day.exercises?.length || 0), 0);
    const dayCount = Object.values(PROGRAM.schedule).filter(Boolean).length;
    log(`📊 ${dayCount} giorni, ${exCount} esercizi totali, ${PROGRAM.weeks} settimane`);
  } catch(e) {
    log(`❌ Errore scheda: ${e.message}`, false);
    console.error(e);
  }
};
